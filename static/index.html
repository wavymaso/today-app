<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Today">
  <title>Today</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Ccircle cx='16' cy='17' r='6' fill='%23f5c451'/%3E%3C/svg%3E">
  <!-- Bundled locally so the app works offline -->
  <script src="/static/vendor/tailwind-3.4.17.js"></script>
  <script src="/static/theme.js"></script>
  <style type="text/tailwindcss">
    @layer components {
    .input { @apply w-full rounded-xl border border-slate-200 bg-surface px-3 py-2 text-base sm:text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent; }
    .btn { @apply inline-flex items-center justify-center gap-1.5 rounded-xl px-4 py-2 text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed; }
    .btn-primary { @apply bg-accent text-on-accent hover:opacity-90; }
    .btn-secondary { @apply bg-surface border border-slate-200 text-slate-700 hover:bg-slate-50; }
    .btn-ghost { @apply text-slate-600 hover:bg-slate-100; }
    .card { @apply bg-surface rounded-[1.25rem] border border-slate-200/60; box-shadow: 0 1px 2px rgb(var(--shadow) / .04), 0 12px 32px -18px rgb(var(--shadow) / .18); }
    .label { @apply block text-xs font-medium text-slate-500 mb-1; }
    .chip { @apply inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm transition select-none; }
    .link { @apply text-sm text-slate-500 hover:text-slate-900; }
    .eyebrow { @apply text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-400; }
    }
  </style>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .tabular { font-variant-numeric: tabular-nums; }
    .display { font-family: var(--font-display); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.025em; }
    :root[data-theme="sand"] .display, :root[data-theme="rose"] .display, :root[data-theme="noir"] .display { font-weight: 500; letter-spacing: -0.01em; }
    .nav-link.active { color: rgb(var(--slate-900)); background: rgb(var(--slate-100)); }
    .bottom-link.active { color: rgb(var(--accent)); }
    summary::-webkit-details-marker { display: none; }
    details[open] > summary [data-chevron] { transform: rotate(90deg); }
    .hero { background-image: radial-gradient(120% 140% at 100% 0%, rgb(var(--accent) / .07), transparent 55%); }
    /* Timeline: a hairline down the left with a dot per item. */
    .timeline { position: relative; }
    .timeline::before { content: ""; position: absolute; left: 4.15rem; top: .4rem; bottom: .4rem; width: 1px; background: rgb(var(--slate-200)); }
    .tl-dot { position: absolute; left: calc(4.15rem - 4px); top: 1.05rem; width: 9px; height: 9px; border-radius: 9999px; box-shadow: 0 0 0 3px rgb(var(--surface)); }
    .now-line { position: relative; height: 0; }
    .now-line::after { content: ""; position: absolute; left: 4.15rem; right: 0; top: -1px; border-top: 2px solid rgb(var(--accent)); }
    .now-line::before { content: ""; position: absolute; left: calc(4.15rem - 5px); top: -6px; width: 11px; height: 11px; border-radius: 9999px; background: rgb(var(--accent)); }
    @media (prefers-reduced-motion: no-preference) {
      #view > div > * { animation: fade-in .2s ease-out both; }
      #view > div > *:nth-child(2) { animation-delay: .04s; } #view > div > *:nth-child(3) { animation-delay: .08s; }
      @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <header class="sticky top-0 z-20 bg-slate-50/85 backdrop-blur border-b border-slate-200/70">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-6">
      <a href="#/today" class="font-semibold text-slate-900 flex items-center gap-2">
        <span class="inline-flex w-7 h-7 rounded-lg bg-accent items-center justify-center">
          <span class="w-3 h-3 rounded-full bg-on-accent/90"></span></span>
        Today
      </a>
      <nav id="top-nav" class="hidden sm:flex gap-1 text-sm text-slate-500"></nav>
      <span id="demo-badge" class="hidden ml-auto rounded-full bg-amber-100 text-amber-800 text-xs font-medium px-2.5 py-1">Demo data</span>
    </div>
  </header>

  <main id="view" class="max-w-5xl mx-auto px-4 pt-6 pb-28 sm:pb-12"></main>

  <nav id="bottom-nav" class="sm:hidden fixed bottom-0 inset-x-0 z-20 bg-surface/95 backdrop-blur border-t border-slate-200 grid grid-cols-3 text-[11px] text-slate-400"
       style="padding-bottom: env(safe-area-inset-bottom, 0px)"></nav>

  <div id="modal" class="hidden fixed inset-0 z-30 bg-slate-950/40 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-surface w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between px-5 pt-4">
        <h2 id="modal-title" class="font-semibold text-lg text-slate-900"></h2>
        <button id="modal-close" class="text-slate-400 hover:text-slate-700 text-2xl leading-none px-2" aria-label="Close">&times;</button>
      </div>
      <div id="modal-body" class="p-5"></div>
    </div>
  </div>

  <div id="toast" role="status" class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 sm:bottom-6 z-40 flex items-center gap-3 text-sm rounded-xl pl-4 pr-2 py-2 shadow-lg max-w-[calc(100vw-2rem)]">
    <span data-msg></span>
    <button data-action class="hidden rounded-lg px-2 py-1 font-semibold hover:underline"></button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
